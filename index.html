<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trios Bañados</title>
<style>
  :root{
    --deep:#14263F;
    --deep-2:#1D3757;
    --steel:#3C6285;
    --ivory:#F4F1E9;
    --paper:#FAF8F3;
    --ink:#161C24;
    --ink-soft:#5A6470;
    --amber:#C2892F;
    --amber-soft:#E2C078;
    --red:#8C2F2F;
    --green:#2D7A4F;
    --line:#D6D2C6;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--deep);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--deep);
    color:var(--ivory);
    padding:16px 20px 14px;
    border-bottom:3px solid var(--amber);
  }
  .topbar .brand{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.3px;
  }
  .topbar .sub{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--amber-soft);
  }

  /* ---------- generic ---------- */
  .screen{ padding:20px 20px 100px; flex:1; }
  h2.section-title{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:20px;
    margin:0 0 4px;
    color:var(--deep);
  }
  p.hint{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px;
    line-height:1.45;
  }
  label.field-label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text], input[type=number]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{ outline:none; border-color:var(--steel); }
  select{
    width:100%;
    padding:11px 10px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:15px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    -webkit-appearance:menulist;
    appearance:menulist;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .btn{
    display:block;
    width:100%;
    text-align:center;
    padding:15px;
    border-radius:10px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--deep); color:var(--ivory); }
  .btn-primary:active{ background:var(--deep-2); }
  .btn-ghost{ background:transparent; color:var(--deep); border:1.5px solid var(--deep); }
  .btn-amber{ background:var(--amber); color:var(--deep); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }
  .link-btn{
    background:none;border:none;color:var(--deep);
    text-decoration:underline;font-size:13px;padding:4px 0;cursor:pointer;
    font-family:inherit;
  }
  .error-text{ color:var(--red); font-size:12px; margin-top:6px; min-height:16px; }
  .ok-text{ color:var(--green); font-size:12px; margin-top:6px; font-weight:700; }

  /* ---------- portada ---------- */
  .cover{
    flex:1; position:relative;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:40px 30px 80px;
    background:
      radial-gradient(circle at 50% 22%, rgba(60,98,133,0.28), transparent 62%),
      var(--deep);
    color:var(--ivory);
    min-height:100vh;
  }
  .cover .mark{ font-size:50px; margin-bottom:8px; line-height:1; }
  .cover .kicker{
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color:var(--amber-soft); margin-bottom:14px;
  }
  .cover h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700; font-size:44px; line-height:1.05;
    margin:0 0 6px; color:var(--ivory);
  }
  .cover h1 .accent{ color:var(--amber); display:block; }
  .cover .rule{ width:60px;height:3px;background:var(--amber);border-radius:2px;margin:16px 0 22px; }
  .cover .tagline{
    font-size:14px; color:rgba(244,241,233,0.75);
    margin:0 0 34px; line-height:1.55; max-width:290px;
  }
  .cover .btn{ max-width:300px; }
  .cover .foot{
    position:absolute; bottom:20px; font-size:11px; letter-spacing:1px;
    color:rgba(244,241,233,0.4); text-transform:uppercase;
  }

  /* ---------- jugadores ---------- */
  .ptable-head{
    display:grid; grid-template-columns:1fr 64px 70px;
    gap:8px; padding:0 12px 6px;
    font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-soft); font-weight:700;
  }
  .ptable-head span{ text-align:center; }
  .ptable-head span:first-child{ text-align:left; }
  .ptable-row{
    display:grid; grid-template-columns:1fr 64px 70px;
    gap:8px; align-items:center;
    background:#fff; border:1.5px solid var(--line);
    border-radius:12px; padding:8px 12px; margin-bottom:8px;
  }
  .ptable-row input.name-in{
    width:100%; border:1.5px solid var(--line); border-radius:8px;
    padding:9px 8px; font-size:15px; background:#fff;
  }
  .hcp-sel{ padding:9px 4px !important; font-size:16px; font-weight:600; text-align:center; text-align-last:center; }
  .ptable-diff{
    text-align:center; font-weight:700; font-size:15px;
    color:var(--steel); font-variant-numeric:tabular-nums;
  }
  .ptable-diff small{ display:block; font-size:9px; color:var(--ink-soft); font-weight:500; }

  /* ---------- tabla cancha ---------- */
  table.course-tbl{ width:100%; border-collapse:collapse; font-size:12px; }
  table.course-tbl th, table.course-tbl td{
    border-bottom:1px solid var(--line); padding:6px 3px;
    text-align:center; font-variant-numeric:tabular-nums;
  }
  table.course-tbl th{
    font-size:9px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-soft); font-weight:700;
  }
  table.course-tbl td.hcol{ font-weight:700; color:var(--deep); }
  table.course-tbl tr.sep td{
    background:var(--ivory); font-weight:700; color:var(--steel); font-size:11px;
  }
  .si-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:6px; }
  .si-cell{ text-align:center; }
  .si-cell span{ display:block; font-size:10px; color:var(--ink-soft); margin-bottom:4px; }
  .si-cell input{ text-align:center; padding:8px 2px; font-size:14px; }
  .mini-label{
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--amber); font-weight:700; margin:14px 0 8px;
  }

  /* ---------- juego ---------- */
  .hole-nav{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .nav-arrow{
    width:44px;height:44px; flex-shrink:0; border-radius:12px; border:none;
    background:var(--deep); color:var(--ivory); font-size:24px; font-weight:700;
    line-height:1; cursor:pointer; display:flex;align-items:center;justify-content:center;
  }
  .nav-arrow:active{ background:var(--deep-2); }
  .progress-dots{ display:flex; gap:4px; flex:1; justify-content:center; flex-wrap:wrap; }
  .dot{ width:14px;height:9px;border-radius:3px;background:var(--line);cursor:pointer; }
  .dot.done{ background:var(--steel); }
  .dot.current{ background:var(--amber); height:11px; }
  .hole-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .hole-number{
    font-family:Georgia,'Times New Roman',serif; font-weight:700;
    font-size:46px; color:var(--deep); line-height:1;
  }
  .hole-meta{ text-align:right; font-size:12px; color:var(--ink-soft); }
  .hole-meta b{ color:var(--ink); }

  .play-head{
    display:grid; grid-template-columns:1fr 78px 58px;
    gap:8px; padding:0 12px 6px;
    font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-soft); font-weight:700;
  }
  .play-head span{ text-align:center; }
  .play-head span:first-child{ text-align:left; }
  .play-row{
    display:grid; grid-template-columns:1fr 78px 58px;
    gap:8px; align-items:center;
    background:#fff; border:1.5px solid var(--line);
    border-radius:12px; padding:10px 12px; margin-bottom:8px;
  }
  .play-name{ font-size:14px; font-weight:600; }
  .play-name small{ display:block; font-size:10px; color:var(--ink-soft); font-weight:500; }
  .score-sel{
    padding:9px 4px !important; font-size:18px; font-weight:700;
    text-align:center; text-align-last:center;
    border-color:var(--steel) !important; color:var(--deep);
  }
  .pt-cell{
    text-align:center; font-family:Georgia,'Times New Roman',serif;
    font-weight:700; font-size:20px; font-variant-numeric:tabular-nums;
  }
  .pt-pos{ color:var(--green); }
  .pt-neg{ color:var(--red); }
  .pt-zero{ color:var(--ink-soft); }
  .result-pending{
    margin-top:10px; padding:14px; border:1.5px dashed var(--line);
    border-radius:var(--radius); text-align:center; font-size:13px; color:var(--ink-soft);
  }
  .acum-bar{
    position:sticky; bottom:0; left:0;right:0;
    background:var(--deep); border-top:3px solid var(--amber);
    display:flex; align-items:stretch; gap:6px; padding:8px;
  }
  .acum-arrow{
    flex:0 0 76px; border:none; border-radius:10px;
    background:var(--deep-2); color:var(--ivory);
    font-size:13px; font-weight:700; cursor:pointer; padding:10px 4px;
    font-family:inherit;
  }
  .acum-arrow:active{ background:var(--steel); }
  .acum-center{
    flex:1; border:none; border-radius:10px; background:var(--amber);
    color:var(--deep); cursor:pointer; padding:6px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-family:inherit;
  }
  .acum-label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .acum-vals{
    font-family:Georgia,'Times New Roman',serif; font-weight:700;
    font-size:16px; font-variant-numeric:tabular-nums;
  }

  /* ---------- resultado / scorecard ---------- */
  .podium-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 16px; margin-bottom:10px;
  }
  .podium-row.winner{ border-color:var(--amber); background:#FFFBF0; }
  .podium-name{ font-weight:700; font-size:15px; }
  .podium-pts{
    font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:22px;
  }
  table.summary{ width:100%; border-collapse:collapse; font-size:12px; }
  table.summary th, table.summary td{
    border-bottom:1px solid var(--line); padding:7px 3px; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  table.summary th{
    font-size:10px; text-transform:uppercase; color:var(--ink-soft); font-weight:700;
  }
  table.summary td.hole-col{ font-weight:700; color:var(--deep); }
  .pos-cell{ color:var(--green); font-weight:700; }
  .neg-cell{ color:var(--red); font-weight:700; }

  .sc-screen{ padding:16px 0 100px; flex:1; overflow-x:hidden; }
  .sc-block{
    margin:0 8px 20px; border:1px solid var(--line);
    border-radius:12px; overflow:hidden;
  }
  .sc-name{
    background:var(--deep); color:var(--ivory); font-weight:700; font-size:14px;
    padding:8px 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .sc-total{ font-family:Georgia,'Times New Roman',serif; font-size:18px; font-weight:700; }
  .sc-total.pos{ color:#7EC8A0; }
  .sc-total.neg{ color:#E08080; }
  .sc-resumen-head{
    background:var(--steel); color:var(--ivory);
    font-weight:700; font-size:14px; padding:8px 12px;
  }
  table.sc-tbl{ width:100%; border-collapse:collapse; font-size:11px; table-layout:fixed; }
  table.sc-tbl th, table.sc-tbl td{
    text-align:center; padding:5px 1px; border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums; overflow:hidden;
  }
  .sc-hdr th{
    background:#E8EFF7; color:var(--deep); font-weight:700; font-size:10px;
    border-bottom:3px double var(--deep);
  }
  td.sc-lbl, th.sc-lbl{
    text-align:left; font-size:10px; font-weight:600; color:var(--ink-soft);
    padding-left:8px; width:42px;
  }
  .sc-hdr th.sc-lbl{ color:var(--deep); }
  td.sc-sub, th.sc-sub{
    background:var(--ivory); font-weight:700; font-size:11px;
    border-left:1px solid var(--line);
  }
  .sc-score-row td{ font-weight:600; color:var(--ink); font-size:12px; }
  .sc-score-row td.def-val{ color:var(--red); font-style:italic; }
  .sc-net-row td{ font-size:11px; color:var(--steel); font-style:italic; }
  .sc-tag{ color:var(--amber); font-size:8px; margin-left:1px; font-style:normal; }
  .sc-pts-row td{ font-size:11px; }
  .sc-tot-row{ background:var(--ivory); }
  .sc-tot-row td{ font-weight:700; font-size:12px; }
  .sc-sep td{ padding:2px; background:var(--line); border:none; }
  .sc-res-tbl th, .sc-res-tbl td{ padding:8px 4px; font-size:13px; }
  .sc-res-tbl .sc-tot-row td{ font-family:Georgia,'Times New Roman',serif; font-size:16px; }

  /* ---------- historial ---------- */
  .hist-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:14px;
  }
  .hist-head{ display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px; }
  .hist-fecha{ font-size:12px;color:var(--ink-soft); }
  .hist-cancha{ font-size:13px;font-weight:700;color:var(--deep); }
  .hist-btn{
    border:1.5px solid var(--steel);background:#fff;color:var(--deep);
    border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .hist-res{ display:flex;gap:6px;flex-wrap:wrap; }
  .hist-p{
    display:flex;flex-direction:column;align-items:center;
    background:var(--ivory);border-radius:8px;padding:6px 12px;min-width:64px;
  }
  .hist-p .n{ font-size:11px;color:var(--ink-soft); }
  .hist-p .v{ font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:18px; }

  /* ---------- confirm ---------- */
  .overlay{
    position:absolute; inset:0; background:rgba(10,20,32,0.72);
    display:flex; align-items:center; justify-content:center; padding:24px; z-index:100;
  }
  .confirm-box{
    background:var(--paper); border-radius:16px; padding:22px 20px;
    max-width:330px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.4);
    max-height:88vh; overflow-y:auto;
  }
  .confirm-title{
    font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:19px;
    color:var(--deep); margin-bottom:8px;
  }
  .confirm-text{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:18px; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-btn{
    flex:1; padding:13px; border-radius:10px; border:none;
    font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  .confirm-btn.ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink-soft); }
  .confirm-btn.primary{ background:var(--deep); color:var(--ivory); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==================== CANCHAS BASE (vienen de fábrica) ==================== */
const BUILTIN_COURSES = {
  'Club de Polo y Equitación San Cristóbal': {
    par: [4,5,3,4,4,3,5,4,4, 4,4,5,3,4,4,3,5,4],
    si:  [11,7,15,13,5,17,1,9,3, 4,10,12,18,8,6,16,2,14],
    tees: {
      'Negra':  [392,580,170,413,425,210,525,435,380, 415,333,560,204,437,447,232,630,471],
      'Azul':   [380,553,160,399,374,208,500,384,361, 385,320,540,187,408,426,192,571,460],
      'Blanca': [368,532,150,385,323,199,481,361,346, 372,312,515,170,387,402,176,553,438],
      'Dorada': [324,469,126,345,304,169,459,359,333, 315,255,455,150,374,343,160,510,383],
      'Roja':   [324,469,126,345,253,156,459,340,333, 315,255,455,150,374,343,131,510,383],
    }
  },
  'Club de Golf Los Leones': {
    par: [4,4,3,5,4,3,4,4,5, 4,3,4,4,3,4,4,5,5],
    si:  [13,7,15,1,11,17,3,9,5, 12,16,6,2,18,10,4,8,14],
    tees: {
      'Varones': [369,409,189,561,408,181,425,407,557, 337,190,378,438,165,415,433,529,511],
      'Seniors': [349,365,178,528,364,174,382,392,524, 325,178,350,393,151,380,411,509,487],
      'Damas':   [313,336,140,481,312,162,352,325,485, 289,154,316,343,135,365,359,447,463],
    }
  }
};

/* ==================== ESTADO ==================== */
const DEFAULT_STATE = () => ({
  screen: 'cover',
  course: { name:'', si:Array(18).fill(''), par:Array(18).fill(''), tees:null, selectedTee:null },
  players: [ {name:'',hcp:''}, {name:'',hcp:''}, {name:'',hcp:''} ],
  currentHole: 1,
  scores: Array.from({length:18}, ()=> [null,null,null]),
  playerTotals: [0,0,0],
  _savedToHistory: false,
  _nineHolesOnly: false,
});

let state = null;
try{
  const saved = localStorage.getItem('trios_round');
  state = saved ? JSON.parse(saved) : DEFAULT_STATE();
}catch(e){ state = DEFAULT_STATE(); }
if(!Array.isArray(state.players) || state.players.length!==3){
  state.players = [ {name:'',hcp:''}, {name:'',hcp:''}, {name:'',hcp:''} ];
}
if(!Array.isArray(state.scores) || state.scores.length!==18){
  state.scores = Array.from({length:18}, ()=> [null,null,null]);
}

function persist(){
  try{ localStorage.setItem('trios_round', JSON.stringify(state)); }catch(e){}
}
if(typeof document!=='undefined'){
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persist(); });
  window.addEventListener('pagehide', ()=> persist());
  window.addEventListener('beforeunload', ()=> persist());
}

/* ==================== CANCHAS GUARDADAS POR EL USUARIO ==================== */
function loadUserCourses(){
  try{ return JSON.parse(localStorage.getItem('trios_courses')||'{}'); }catch(e){ return {}; }
}
function saveUserCourse(name, data){
  try{
    const all = loadUserCourses();
    all[name] = data;
    localStorage.setItem('trios_courses', JSON.stringify(all));
  }catch(e){}
}
function deleteUserCourse(name){
  try{
    const all = loadUserCourses();
    delete all[name];
    localStorage.setItem('trios_courses', JSON.stringify(all));
  }catch(e){}
}
// Todas las canchas disponibles: las de fábrica + las que agregue el usuario
function allCourses(){
  return Object.assign({}, BUILTIN_COURSES, loadUserCourses());
}

/* ==================== HISTORIAL ==================== */
function loadHistory(){
  try{
    const hist = JSON.parse(localStorage.getItem('trios_history')||'[]');
    const treintaDias = 30*24*60*60*1000, ahora = Date.now();
    const vigentes = hist.filter(r => (ahora-(r.id||0)) <= treintaDias);
    if(vigentes.length!==hist.length) localStorage.setItem('trios_history', JSON.stringify(vigentes));
    return vigentes;
  }catch(e){ return []; }
}
function saveRoundToHistory(){
  try{
    const hist = loadHistory();
    hist.unshift({
      id: Date.now(),
      fecha: new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}),
      hora: new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}),
      cancha: state.course.name||'Sin nombre',
      tee: state.course.selectedTee||'',
      players: state.players.map((p,i)=>({name:p.name||('Jugador '+(i+1)), hcp:p.hcp})),
      si: state.course.si,
      scores: state.scores,
      playerTotals: state.playerTotals,
    });
    if(hist.length>10) hist.length=10;
    localStorage.setItem('trios_history', JSON.stringify(hist));
  }catch(e){}
}
function exportRoundAsJSON(round){
  const blob = new Blob([JSON.stringify(round,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;
  a.download='Trios_'+round.fecha.replace(/\//g,'-')+'_'+(round.cancha||'cancha').replace(/\s+/g,'_').slice(0,22)+'.json';
  a.click();

}

/* ==================== LÓGICA DE JUEGO ==================== */
function lowestHcp(){ return Math.min(...state.players.map(p=>Number(p.hcp)||0)); }
function effectiveHcp(i){ return (Number(state.players[i].hcp)||0) - lowestHcp(); }
function strokesReceived(hcp, si){
  hcp = Number(hcp)||0;
  if(hcp<=0) return 0;
  const full = Math.floor(hcp/18);
  const rem = hcp - full*18;
  return full + (rem>=si ? 1 : 0);
}
function strokesForPlayer(i, si){ return strokesReceived(effectiveHcp(i), si); }

function holeHasAnyScore(hole){ return state.scores[hole-1].some(s=>s!=null); }
function effectiveGrossArr(hole){
  const arr = state.scores[hole-1];
  if(!arr.some(s=>s!=null)) return null;
  return arr.map(s=> s==null?10:s);
}
function displayGross(hole, pi){
  const v = state.scores[hole-1][pi];
  if(v!=null) return v;
  return holeHasAnyScore(hole) ? 10 : null;
}
function finalizeHole(hole){
  if(holeHasAnyScore(hole)){
    state.scores[hole-1] = state.scores[hole-1].map(s=> s==null?10:s);
  }
}

// Puntos del hoyo para 3 jugadores. Suma siempre cero.
//  todos distintos     -> +2 / 0 / -2
//  2 mejores empatan   -> +1 / +1 / -2
//  2 peores empatan    -> +2 / -1 / -1
//  los 3 empatan       ->  0 /  0 /  0
function computeHoleResult(hole, grossArr){
  const si = Number(state.course.si[hole-1]) || 1;
  const net = grossArr.map((g,i)=> g==null?null:g - strokesForPlayer(i, si));
  const pts = [0,0,0];
  let detalle = '';
  if(net.some(n=>n==null)) return { net, pts, detalle };
  const min = Math.min(...net), max = Math.max(...net);
  if(min===max){
    detalle = 'Los tres empatan · nadie suma';
    return { net, pts, detalle };
  }
  const mejores = net.map((v,i)=>v===min?i:-1).filter(i=>i>=0);
  const peores  = net.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
  if(mejores.length===2){
    mejores.forEach(i=>pts[i]=1);
    peores.forEach(i=>pts[i]=-2);
    detalle = 'Empate en el mejor · +1 / +1 / −2';
  } else if(peores.length===2){
    mejores.forEach(i=>pts[i]=2);
    peores.forEach(i=>pts[i]=-1);
    detalle = 'Empate en el peor · +2 / −1 / −1';
  } else {
    net.forEach((v,i)=>{ pts[i] = v===min?2 : v===max?-2 : 0; });
    detalle = 'Los tres distintos · +2 / 0 / −2';
  }
  return { net, pts, detalle };
}

function recomputeTotals(){
  const totals=[0,0,0];
  const maxHole = state._nineHolesOnly ? 9 : 18;
  for(let hole=1; hole<=maxHole; hole++){
    const eff = effectiveGrossArr(hole);
    if(!eff) continue;
    const r = computeHoleResult(hole, eff);
    r.pts.forEach((p,i)=> totals[i]+=p);
  }
  state.playerTotals = totals;
}
function pointsByNine(){ // [ida, vuelta] por jugador
  const res = [[0,0],[0,0],[0,0]];
  for(let hole=1; hole<=18; hole++){
    const eff = effectiveGrossArr(hole);
    if(!eff) continue;
    const r = computeHoleResult(hole, eff);
    const n = hole<=9 ? 0 : 1;
    r.pts.forEach((p,i)=> res[i][n]+=p);
  }
  return res;
}

/* ==================== HELPERS DE RENDER ==================== */
const $ = sel => document.querySelector(sel);
function h(tag, attrs={}, children=[]){
  const el = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') el.className = attrs[k];
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    el.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return el;
}
function topbar(sub){
  return h('div',{class:'topbar'},[
    h('div',{class:'brand'},'Trios Bañados'),
    h('div',{class:'sub'}, sub||'3 jugadores · 18 hoyos')
  ]);
}
const fmtPts = v => v==null?'—':(v>0?'+':'')+v;
const fmt = v => v==null?'—':String(v);
function ptClass(v){ return v>0?'pt-pos':v<0?'pt-neg':'pt-zero'; }
function cellClass(v){ return v>0?'pos-cell':v<0?'neg-cell':''; }

function renderPlay(){
  const app=$('#app'); app.innerHTML='';
  const hole = state.currentHole;
  app.appendChild(topbar(state.course.name || 'En juego'));
  const s = h('div',{class:'screen'});

  function irAtras(){
    finalizeHole(hole);
    if(hole>1) state.currentHole=hole-1;
    else state.screen='players';
    persist(); render();
  }
  function irAdelante(){
    finalizeHole(hole);
    if(hole<18) state.currentHole=hole+1;
    else state.screen='summary';
    persist(); render();
  }
  function irAHoyo(i){ finalizeHole(hole); state.currentHole=i; persist(); render(); }

  // Navegación
  const nav = h('div',{class:'hole-nav'});
  nav.appendChild(h('button',{class:'nav-arrow', onclick:irAtras},'‹'));
  const dots = h('div',{class:'progress-dots'});
  for(let i=1;i<=18;i++){
    let cls='dot';
    if(state.scores[i-1].every(v=>v!=null)) cls+=' done';
    if(i===hole) cls+=' current';
    dots.appendChild(h('div',{class:cls, onclick:()=>irAHoyo(i)}));
  }
  nav.appendChild(dots);
  nav.appendChild(h('button',{class:'nav-arrow', onclick:irAdelante}, hole<18?'›':'✓'));
  s.appendChild(nav);

  // Cabecera del hoyo
  const meta=[];
  if(state.course.par && state.course.par[hole-1]!==''){
    meta.push('Par ', h('b',{},String(state.course.par[hole-1])), h('br'));
  }
  if(state.course.tees && state.course.selectedTee){
    meta.push(state.course.selectedTee+': ', h('b',{}, state.course.tees[state.course.selectedTee][hole-1]+' yds'), h('br'));
  }
  meta.push('Índice hándicap: ', h('b',{},String(state.course.si[hole-1]||'—')));
  s.appendChild(h('div',{class:'hole-header'},[
    h('div',{},[
      h('div',{class:'hole-meta', style:'text-align:left;'},'Hoyo'),
      h('div',{class:'hole-number'}, String(hole))
    ]),
    h('div',{class:'hole-meta'}, meta)
  ]));

  // Filas de jugadores: nombre · score · puntos
  const si = Number(state.course.si[hole-1])||1;
  const grossArr = state.scores[hole-1];
  const completo = grossArr.every(v=>v!=null);
  const res = completo ? computeHoleResult(hole, grossArr) : null;

  s.appendChild(h('div',{class:'play-head'},[
    h('span',{},'Jugador'), h('span',{},'Score'), h('span',{},'Pts')
  ]));

  state.players.forEach((p,pi)=>{
    const strokes = strokesForPlayer(pi, si);
    const row = h('div',{class:'play-row'});
    row.appendChild(h('div',{class:'play-name'},[
      p.name || ('Jugador '+(pi+1)),
      h('small',{}, strokes>0 ? 'recibe '+strokes+' palo'+(strokes>1?'s':'') : 'sin ventaja')
    ]));

    const sel = h('select',{class:'score-sel'});
    const ph = h('option',{value:''},'–');
    if(grossArr[pi]==null) ph.setAttribute('selected','selected');
    sel.appendChild(ph);
    for(let v=1;v<=12;v++){
      const o = h('option',{value:v}, String(v));
      if(grossArr[pi]===v) o.setAttribute('selected','selected');
      sel.appendChild(o);
    }
    sel.addEventListener('change', e=>{
      state.scores[hole-1][pi] = e.target.value===''?null:Number(e.target.value);
      persist(); render();
    });
    row.appendChild(sel);

    const pv = res ? res.pts[pi] : null;
    row.appendChild(h('div',{class:'pt-cell '+(pv==null?'pt-zero':ptClass(pv))}, fmtPts(pv)));
    s.appendChild(row);
  });

  if(completo){

/* ==================== RESULTADO FINAL ==================== */
function buildReport(){
  recomputeTotals();
  const nm = i => state.players[i].name || ('Jugador '+(i+1));
  const fecha = new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
  const low = lowestHcp();
  const maxHole = state._nineHolesOnly ? 9 : 18;

  // Datos por hoyo
  const holePts=[], holeNet=[], holeGross=[];
  for(let hole=1;hole<=maxHole;hole++){
    const eff = effectiveGrossArr(hole);
    if(!eff){ holePts.push(null); holeNet.push(null); holeGross.push(null); continue; }
    const r = computeHoleResult(hole, eff);
    holeGross.push(eff);
    holeNet.push(r.net);
    holePts.push(r.pts);
  }
  const sum = (arr, pi, a, b) => {
    let t=0, ok=true;
    for(let x=a;x<=b;x++){ if(!arr[x-1]){ok=false;break;} t+=arr[x-1][pi]; }
    return ok?t:null;
  };
  const cel = v => (v==null?'—':String(v)).padStart(4);
  const celP = v => (v==null?'—':(v>0?'+':'')+v).padStart(4);

  let t = '';
  t += '⛳  T R I O S   B A Ñ A D O S'+(state._nineHolesOnly?' · 9 HOYOS':'')+'\n';
  t += (state.course.name||'')+(state.course.selectedTee?'  ·  Tee '+state.course.selectedTee:'')+'\n';
  t += fecha+'\n';
  t += '═'.repeat(46)+'\n\n';

  // --- RESULTADO FINAL ---
  t += 'RESULTADO FINAL\n';
  t += '─'.repeat(46)+'\n';
  const order = state.players.map((p,i)=>({name:nm(i), i, pts:state.playerTotals[i]})).sort((a,b)=>b.pts-a.pts);
  order.forEach((p,idx)=>{
    t += (idx===0?'🥇 ':'   ') + p.name.padEnd(20) + fmtPts(p.pts).padStart(6) + ' pts\n';
  });
  t += '\n';

  // --- CARTILLA ---
  t += 'CARTILLA\n';
  t += '─'.repeat(46)+'\n';
  t += 'Jugador'.padEnd(20)+'Hcp'.padStart(6)+'Ventaja'.padStart(14)+'\n';
  state.players.forEach((p,i)=>{
    const d = (Number(p.hcp)||0)-low;
    t += nm(i).padEnd(20)+String(p.hcp||'-').padStart(6)+(d===0?'scratch':'+'+d+' palos').padStart(14)+'\n';
  });
  t += '\n';

  // --- TABLA POR JUGADOR (Hoyo / Score / Neto / Pts) ---
  const bloquesRep = state._nineHolesOnly ? [[1,9,'IDA']] : [[1,9,'IDA'],[10,18,'VTA']];
  state.players.forEach((p,pi)=>{
    const totScore = sum(holeGross,pi,1,maxHole);
    const totNet   = sum(holeNet,pi,1,maxHole);
    const totPts   = sum(holePts,pi,1,maxHole);
    t += '═'.repeat(46)+'\n';
    t += nm(pi).toUpperCase()+'   ('+fmtPts(state.playerTotals[pi])+' pts)\n';
    t += '═'.repeat(46)+'\n';
    bloquesRep.forEach(([a,b,lbl])=>{
      let hdr='Hoyo ', sc='Score', nt='Neto ', pt='Pts  ';
      for(let x=a;x<=Math.min(b,maxHole);x++){
        hdr += String(x).padStart(4);
        sc  += cel(holeGross[x-1]?holeGross[x-1][pi]:null);
        nt  += cel(holeNet[x-1]?holeNet[x-1][pi]:null);
        pt  += celP(holePts[x-1]?holePts[x-1][pi]:null);
      }
      hdr += ' │'+lbl.padStart(5);
      sc  += ' │'+cel(sum(holeGross,pi,a,Math.min(b,maxHole))).padStart(5);
      nt  += ' │'+cel(sum(holeNet,pi,a,Math.min(b,maxHole))).padStart(5);
      pt  += ' │'+celP(sum(holePts,pi,a,Math.min(b,maxHole))).padStart(5);
      t += hdr+'\n'+'─'.repeat(46)+'\n'+sc+'\n'+nt+'\n'+pt+'\n';
      if(lbl==='IDA' && !state._nineHolesOnly) t += '\n';
    });
    t += '─'.repeat(46)+'\n';
    t += 'Tot. Score'.padEnd(16)+String(totScore==null?'—':totScore).padStart(8)+'\n';
    t += 'Tot. Neto'.padEnd(16)+String(totNet==null?'—':totNet).padStart(8)+'\n';
    t += 'Tot. Puntos'.padEnd(16)+fmtPts(totPts).padStart(8)+'\n\n';
  });

  t += '═'.repeat(46)+'\n';
  t += 'Puntos por hoyo: los tres distintos +2/0/−2 ·\n';
  t += 'empate en el mejor +1/+1/−2 ·\n';
  t += 'empate en el peor +2/−1/−1\n';
  return t;
}
function sendEmail(){
  const fecha = new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
  window.location.href = 'mailto:?subject='+encodeURIComponent('Trios Bañados - '+fecha)+'&body='+encodeURIComponent(buildReport());
}
async function shareResult(){
  const txt = buildReport();
  if(navigator.share){
    try{ await navigator.share({title:'Trios Bañados', text:txt}); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(txt); alert('Reporte copiado. Pégalo en WhatsApp, Mail o donde quieras.'); }
  catch(e){ prompt('Copia este texto:', txt); }
}

    [['Tot. Score',fmt(totScore),''],['Tot. Neto',fmt(totNet),''],['Tot. Pts',fmtPts(totPts),cellClass(totPts)]].forEach(([lbl,val,cls])=>{
      const r = h('tr',{class:'sc-tot-row'});
      r.appendChild(h('td',{class:'sc-lbl'},lbl));
      for(let i=0;i<9;i++) r.appendChild(h('td',{},''));
      r.appendChild(h('td',{class:'sc-sub '+cls}, val));
      tbl.appendChild(r);
    });
    wrap.appendChild(tbl);
    s.appendChild(wrap);
  });

  s.appendChild(h('div',{class:'card', style:'background:#FBF7EA;margin:0 8px 16px;'},[
    h('div',{style:'font-size:12px;color:var(--ink-soft);line-height:1.6;'},[
      h('b',{},'Puntos por hoyo: '),
      'los tres distintos → +2 / 0 / −2 · empate en el mejor → +1 / +1 / −2 · empate en el peor → +2 / −1 / −1. ',
      h('span',{style:'color:var(--red);font-style:italic;'},'Los números en rojo cursiva'),
      ' son hoyos sin anotar; se asignó 10 automáticamente.'
    ])
  ]));

  s.appendChild(h('button',{class:'btn btn-primary', style:'margin:0 12px;width:calc(100% - 24px);', onclick:()=>{
    state.currentHole=1; state.screen='play'; persist(); render();
  }},'📝 Revisar hoyo por hoyo'));
  s.appendChild(h('button',{class:'btn btn-ghost', style:'margin:8px 12px 0;width:calc(100% - 24px);', onclick:()=>{
    state.screen='players'; persist(); render();
  }},'✏️ Corregir nombre / hcp'));
  s.appendChild(h('button',{class:'btn btn-ghost', style:'margin:8px 12px 0;width:calc(100% - 24px);', onclick:()=>{
    state.screen='summary'; persist(); render();
  }},'← Volver al resultado'));
  app.appendChild(s);
}

/* ==================== HISTORIAL ==================== */
function renderHistory(){
  const app=$('#app'); app.innerHTML='';
  app.appendChild(topbar('Historial'));
  const s = h('div',{class:'screen'});
  s.appendChild(h('h2',{class:'section-title'},'Últimas rondas'));
  s.appendChild(h('p',{class:'hint'},'Se guardan las últimas 10 rondas de los últimos 30 días.'));

  const hist = loadHistory();
  if(!hist.length){
    s.appendChild(h('div',{class:'result-pending'},'Aún no hay rondas guardadas.'));
  } else {
    hist.forEach(round=>{
      const order = round.players.map((p,i)=>({name:p.name, pts:round.playerTotals[i]})).sort((a,b)=>b.pts-a.pts);
      const card = h('div',{class:'hist-card'});
      card.appendChild(h('div',{class:'hist-head'},[
        h('div',{},[
          h('div',{class:'hist-fecha'}, round.fecha+' · '+round.hora),
          h('div',{class:'hist-cancha'}, round.cancha+(round.tee?' · '+round.tee:''))
        ]),
        h('button',{class:'hist-btn', onclick:()=>exportRoundAsJSON(round)},'⬇ JSON')
      ]));
      const res = h('div',{class:'hist-res'});
      order.forEach(({name,pts})=>{
        res.appendChild(h('div',{class:'hist-p'},[
          h('span',{class:'n'}, name.split(' ')[0]),
          h('span',{class:'v '+(pts>0?'pos-cell':pts<0?'neg-cell':'')}, fmtPts(pts))
        ]));
      });
      card.appendChild(res);
      s.appendChild(card);
    });
    s.appendChild(h('button',{class:'link-btn', style:'display:block;margin:16px auto 0;color:var(--red);font-size:12px;', onclick:()=>{
      if(confirm('¿Borrar todo el historial?')){ localStorage.removeItem('trios_history'); render(); }
    }},'Borrar historial'));
  }

  s.appendChild(h('button',{class:'btn btn-ghost', style:'margin-top:20px;', onclick:()=>{ state.screen='cover'; persist(); render(); }},'← Volver'));
  app.appendChild(s);
}

/* ==================== ROUTER ==================== */
function render(){
  const r = {
    cover: renderCover, players: renderPlayers, course: renderCourse,
    newcourse: renderNewCourse, play: renderPlay, totals: renderTotals,
    summary: renderSummary, scorecard: renderScorecard, history: renderHistory
  }[state.screen] || renderCover;
  r();
  try{ persist(); }catch(e){}
}
render();
</script>
